[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"

# Speed up debug builds: optimize the heavy UI dependencies (must live in the root Cargo.toml).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
# The data layer runs inside the debug app too: a cold index of ~1GB must stay in seconds.
agent-session-core = { opt-level = 3 }
libsqlite3-sys = { opt-level = 3 }
rusqlite = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }
memchr = { opt-level = 3 }
rayon-core = { opt-level = 3 }
chrono = { opt-level = 3 }
