[package]
name = "agent-session-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS desktop app listing Claude Code sessions"
default-run = "agent-session-manager"

[dependencies]
agent-session-core = { path = "../core" }
anyhow.workspace = true
async-channel = "2.5.0"
chrono = "0.4.45"
gpui-kit = "=0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
tempfile = "3.27.0"
