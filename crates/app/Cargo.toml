[package]
name = "agent-session-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS desktop app listing Claude Code sessions"
default-run = "agent-session-manager"

[dependencies]
agent-session-core = { path = "../core" }
anyhow.workspace = true
async-channel = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
gpui-kit = "=0.6.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
tempfile = "3.27.0"
